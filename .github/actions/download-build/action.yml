name: Download build artifacts
description: Download the generated .output directory with the pinned actions/download-artifact.

runs:
  using: composite
  steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: rules-output
        path: .output
