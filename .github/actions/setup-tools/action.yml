name: Set up Python and tool cache
description: Install Python, prepare scripts, and cache the downloaded compiler binaries.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Prepare scripts
      shell: bash
      run: find scripts -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} +

    - name: Restore tool cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .bin
        key: rules-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lib/common.sh') }}
