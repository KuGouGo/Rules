name: Upload build artifacts
description: Upload the generated .output directory with the pinned actions/upload-artifact.

runs:
  using: composite
  steps:
    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rules-output
        path: .output
        retention-days: 1
        include-hidden-files: true
