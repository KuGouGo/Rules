name: Sync Rules

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/actions/**'
      - 'Makefile'
      - 'config/**'
      - 'scripts/**'
      - 'sources/custom/**'
      - 'templates/**'
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-rules
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Prepare scripts
        run: find scripts -type f \( -name '*.sh' -o -name '*.py' \) -exec chmod +x {} +

      - name: Validate
        run: REQUIRE_SHELLCHECK=1 make validate

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python and tool cache
        uses: ./.github/actions/setup-tools

      - name: Sync upstream rules
        run: ./scripts/commands/sync-upstream.sh

      - name: Build custom rules
        run: ./scripts/commands/build-custom-rules.sh

      - name: Audit rule overlaps
        run: python3 scripts/tools/audit-rule-overlaps.py .output/.canonical --output .output/overlap-report.json --fail-internal

      - name: Guard artifacts
        run: ./scripts/commands/check-artifacts.sh

      - name: Publish client branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_SOURCE_SHA: ${{ github.sha }}
        run: ./scripts/commands/publish-branches.sh

      - name: Build summary
        if: always()
        run: |
          if [ -d .output ]; then
            find .output -maxdepth 2 -type d | sort
          fi
          git status --short
