name: Auto-merge trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  # A human approval on a normal PR enables GitHub native auto-merge, which
  # merges once branch protection's required checks are satisfied.
  pull_request_review:
    types: [submitted]
  # Pull requests created with GITHUB_TOKEN do not start another PR workflow.
  # The dependency workflow has already validated the proposed commit, so its
  # successful completion is the reliable automation entry point.
  workflow_run:
    workflows: [Update dependencies]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       github.head_ref == 'automation/dependency-updates') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    steps:
      - name: Merge validated dependency update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            pr="$EVENT_PR"
          else
            pr="$(gh pr list --repo "$REPOSITORY" \
              --head automation/dependency-updates --base main --state open \
              --json number --jq '.[0].number // empty')"
            if [ -z "$pr" ]; then
              echo "No dependency update PR is open"
              exit 0
            fi
          fi

          trusted="$(gh api "repos/${REPOSITORY}/pulls/${pr}" \
            --jq '[.draft == false, .state == "open", .head.ref == "automation/dependency-updates", .head.repo.full_name == "'"$REPOSITORY"'", .user.login == "github-actions[bot]"] | all')"
          if [ "$trusted" != "true" ]; then
            echo "PR #${pr} failed the trusted dependency-update checks" >&2
            exit 1
          fi

          # Native auto-merge (not `gh pr checks`) is the reliable path for PRs
          # pushed by GITHUB_TOKEN: GitHub suppresses `pull_request` check
          # suites for such pushes, so no required check ever associates with
          # the PR and `gh pr checks --required` fails. The native engine waits
          # for branch protection's required "validate" check and merges.
          echo "Arming native auto-merge for validated dependency update PR #${pr}"
          # -R is required: `gh pr merge` otherwise resolves the repo via git,
          # which fails in this runner (no checkout step).
          gh pr merge "$pr" --repo "$REPOSITORY" --auto --squash --delete-branch

  # Normal PRs: a human approval arms GitHub native auto-merge. The native
  # engine waits for branch protection's required checks and approvals, so
  # nothing else needs to poll — and unlike gh pr checks, it is not affected
  # by GITHUB_TOKEN PR-event suppression.
  auto-merge-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge on approved PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # -R is required: `gh pr merge` otherwise resolves the repo via git,
          # which fails in this runner (no checkout step).
          gh pr merge "$PR" --repo "$REPOSITORY" --auto --squash --delete-branch
