name: Auto-merge trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  # A human approval on a normal PR enables GitHub native auto-merge, which
  # merges once branch protection's required checks are satisfied.
  pull_request_review:
    types: [submitted]
  # Pull requests created with GITHUB_TOKEN do not start another PR workflow.
  # Each updater dispatches Validation, records a success status on the exact
  # validated head SHA, and this completion event retries the guarded merge.
  workflow_run:
    workflows: [Update dependencies, Update upstream pins]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  # pull_request.number is empty on workflow_run events; fall back to the
  # workflow run id so concurrent dependency completions do not cancel
  # each other under a shared empty group.
  group: automerge-${{ github.event.workflow_run.id || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       (github.head_ref == 'automation/dependency-updates' ||
        github.head_ref == 'automation/upstream-pins')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    steps:
      - name: Merge validated automation update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          COMPLETED_WORKFLOW: ${{ github.event.workflow_run.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            pr="$EVENT_PR"
          else
            case "$COMPLETED_WORKFLOW" in
              "Update dependencies") branch="automation/dependency-updates" ;;
              "Update upstream pins") branch="automation/upstream-pins" ;;
              *) echo "Unsupported updater: $COMPLETED_WORKFLOW" >&2; exit 1 ;;
            esac
            pr="$(gh pr list --repo "$REPOSITORY" \
              --head "$branch" --base main --state open \
              --json number --jq '.[0].number // empty')"
            if [ -z "$pr" ]; then
              echo "No update PR is open for $branch"
              exit 0
            fi
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr}")"
          branch="$(jq -r '.head.ref' <<< "$pr_json")"
          case "$branch" in
            automation/dependency-updates) context="dependency-update-validation" ;;
            automation/upstream-pins) context="upstream-pin-validation" ;;
            *) echo "PR #${pr} uses untrusted branch $branch" >&2; exit 1 ;;
          esac

          trusted="$(jq --arg repository "$REPOSITORY" \
            '[.draft == false, .state == "open", .head.repo.full_name == $repository, .user.login == "github-actions[bot]"] | all' \
            <<< "$pr_json")"
          if [ "$trusted" != "true" ]; then
            echo "PR #${pr} failed the trusted automation checks" >&2
            exit 1
          fi

          # Bind the merge to the exact validated head. A later branch push has
          # no inherited status and therefore cannot reuse an earlier validation.
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          validated="$(gh api "repos/${REPOSITORY}/commits/${head_sha}/status" \
            --jq '[.statuses[] | select(.context == "'"$context"'") | .state] | last // ""')"
          if [ "$validated" != "success" ]; then
            echo "PR #${pr} head ${head_sha} has no successful ${context} status; skipping merge" >&2
            exit 0
          fi

          echo "Merging validated automation PR #${pr}"
          gh pr merge "$pr" --repo "$REPOSITORY" --squash --delete-branch

          # GITHUB_TOKEN merges suppress subsequent push workflows. Dispatch the
          # publication explicitly so the merged pin or dependency is consumed.
          gh workflow run build.yml --repo "$REPOSITORY" --ref main \
            -f scope=auto -f profile=auto

  # Normal PRs: a human approval arms GitHub native auto-merge. The native
  # engine waits for branch protection's required checks and approvals, so
  # nothing else needs to poll — and unlike gh pr checks, it is not affected
  # by GITHUB_TOKEN PR-event suppression.
  auto-merge-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge on approved PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # -R is required: `gh pr merge` otherwise resolves the repo via git,
          # which fails in this runner (no checkout step).
          gh pr merge "$PR" --repo "$REPOSITORY" --auto --squash --delete-branch
