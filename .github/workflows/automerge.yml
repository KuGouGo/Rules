name: Auto-merge trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  # A human approval on a normal PR enables GitHub native auto-merge, which
  # merges once branch protection's required checks are satisfied.
  pull_request_review:
    types: [submitted]
  # Pull requests created with GITHUB_TOKEN do not start another PR workflow.
  # This completion event is the only merge entry point: update-tool-versions.sh
  # validates the branch, records a success status on the validated head SHA,
  # and the merge below refuses any head SHA without that status.
  workflow_run:
    workflows: [Update dependencies]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # pull_request.number is empty on workflow_run events; fall back to the
  # workflow run id so concurrent dependency completions do not cancel
  # each other under a shared empty group.
  group: automerge-${{ github.event.workflow_run.id || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       github.head_ref == 'automation/dependency-updates') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    steps:
      - name: Merge validated dependency update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            pr="$EVENT_PR"
          else
            pr="$(gh pr list --repo "$REPOSITORY" \
              --head automation/dependency-updates --base main --state open \
              --json number --jq '.[0].number // empty')"
            if [ -z "$pr" ]; then
              echo "No dependency update PR is open"
              exit 0
            fi
          fi

          trusted="$(gh api "repos/${REPOSITORY}/pulls/${pr}" \
            --jq '[.draft == false, .state == "open", .head.ref == "automation/dependency-updates", .head.repo.full_name == "'"$REPOSITORY"'", .user.login == "github-actions[bot]"] | all')"
          if [ "$trusted" != "true" ]; then
            echo "PR #${pr} failed the trusted dependency-update checks" >&2
            exit 1
          fi

          # Gate the merge on the exact validated commit. update-tool-versions.sh
          # records a "dependency-update-validation" success status on the head
          # SHA only after the dispatched Validation run passed, so merging is
          # bound to that SHA: a later push to the branch has no status of its
          # own and can never inherit the old commit's validation.
          head_sha="$(gh api "repos/${REPOSITORY}/pulls/${pr}" --jq '.head.sha')"
          validated="$(gh api "repos/${REPOSITORY}/commits/${head_sha}/status" \
            --jq '[.statuses[] | select(.context == "dependency-update-validation") | .state] | last // ""')"
          if [ "$validated" != "success" ]; then
            # Skip (not fail): on the pull_request_target path the status is
            # recorded only after the dispatched Validation run finishes, and
            # the workflow_run completion event is what merges then.
            echo "PR #${pr} head ${head_sha} has no successful dependency-update-validation status; skipping merge" >&2
            exit 0
          fi

          # Merge directly instead of using native auto-merge (`--auto`).
          # PRs pushed by GITHUB_TOKEN get their `pull_request` check suites
          # suppressed, so the branch never reports a completed check and the
          # native engine stalls on a permanent "waiting for checks" state.
          # The commit status gate above is the validation record that the
          # native engine cannot see.
          echo "Merging validated dependency update PR #${pr}"
          # -R is required: `gh pr merge` otherwise resolves the repo via git,
          # which fails in this runner (no checkout step).
          gh pr merge "$pr" --repo "$REPOSITORY" --squash --delete-branch

  # Normal PRs: a human approval arms GitHub native auto-merge. The native
  # engine waits for branch protection's required checks and approvals, so
  # nothing else needs to poll — and unlike gh pr checks, it is not affected
  # by GITHUB_TOKEN PR-event suppression.
  auto-merge-approved:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge on approved PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # -R is required: `gh pr merge` otherwise resolves the repo via git,
          # which fails in this runner (no checkout step).
          gh pr merge "$PR" --repo "$REPOSITORY" --auto --squash --delete-branch
