name: Auto-merge trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
  # Pull requests created with GITHUB_TOKEN do not start another PR workflow.
  # The dependency workflow has already validated the proposed commit, so its
  # successful completion is the reliable automation entry point.
  workflow_run:
    workflows: [Update dependencies]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == 'github-actions[bot]' &&
       github.head_ref == 'automation/dependency-updates') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    steps:
      - name: Merge validated dependency update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            pr="$EVENT_PR"
          else
            pr="$(gh pr list --repo "$REPOSITORY" \
              --head automation/dependency-updates --base main --state open \
              --json number --jq '.[0].number // empty')"
            if [ -z "$pr" ]; then
              echo "No dependency update PR is open"
              exit 0
            fi
          fi

          trusted="$(gh api "repos/${REPOSITORY}/pulls/${pr}" \
            --jq '[.draft == false, .state == "open", .head.ref == "automation/dependency-updates", .head.repo.full_name == "'"$REPOSITORY"'", .user.login == "github-actions[bot]"] | all')"
          if [ "$trusted" != "true" ]; then
            echo "PR #${pr} failed the trusted dependency-update checks" >&2
            exit 1
          fi

          gh pr checks "$pr" --watch --required --interval 20
          echo "Merging validated dependency update PR #${pr}"
          gh pr merge "$pr" --squash --delete-branch
