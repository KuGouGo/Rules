name: 规则错误报告
description: 报告规则集内容或路由语义错误
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填写以下信息,以便快速定位问题。
  - type: input
    id: domain
    attributes:
      label: 涉及域名/列表
      description: 无法正确匹配的域名,或行为异常的规则集(如 domain/cn、domain/apple)
      placeholder: "example.com / domain/cn"
    validations:
      required: true
  - type: dropdown
    id: expected
    attributes:
      label: 预期行为
      description: 该域名在您的路由里应当如何处理
      options:
        - 应直连 (DIRECT)
        - 应走代理 (PROXY)
        - 应被广告拦截 (category-ads-all)
        - 其他
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际匹配到了哪条规则、走了哪个出口
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: 客户端与版本
      description: Surge / Quantumult X / Egern / sing-box / mihomo 及版本
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 订阅地址、日志片段、复现步骤等
